name: Device / firmware port request
description: Request a reviewed target manifest for another Android device or firmware.
title: "[Port] <device> <firmware>"
labels:
  - port-request
body:
  - type: markdown
    attributes:
      value: |
        Do not install an existing build on an unlisted firmware. Remove unrelated personal log lines, and do not upload paid app APKs or music files.
  - type: input
    id: device
    attributes:
      label: Device and firmware
      description: Include model, product device, Android version, and full build fingerprint.
    validations:
      required: true
  - type: input
    id: root
    attributes:
      label: Root and overlay solution
      description: Magisk or KernelSU version, plus the active metamodule when applicable.
    validations:
      required: true
  - type: input
    id: dac
    attributes:
      label: USB DAC and observed behavior
      description: DAC model, source rates tested, displayed rates, expected result, and actual result.
    validations:
      required: true
  - type: textarea
    id: archive
    attributes:
      label: Diagnostic archive link
      description: |
        Run scripts/collect_device_port.sh with adb + root, review the output,
        remove personal information, and attach the resulting archive. It
        should contain the stock ELF files at their original paths, active
        policy/XML/VINTF/init files, AIDL/HIDL discovery, service process maps,
        AudioPolicy/AudioFlinger/ALSA/USB state, and filtered logs. For HIDL,
        include every existing audio.primary*.so, audio.usb*.so,
        audio.bluetooth*.so, android.hardware.audio@*.so, matching service
        binaries, and the mapped PAL/AGM/ACDB dependencies.
    validations:
      required: true
  - type: textarea
    id: stack
    attributes:
      label: Audio stack classification
      description: |-
        State whether the device uses AIDL, HIDL, or both. List the detected
        HAL service name, audio HAL library, USB library, and any audio-related
        libraries shown in audioserver/audio HAL process maps.
    validations:
      required: true
  - type: textarea
    id: transitions
    attributes:
      label: Transition test results
      description: |-
        With one USB DAC connected, report the DAC display and app result for
        44.1 -> 48 -> 96 -> 44.1 kHz, PCM16/24/32 or Float if tested, stop,
        and reconnect. Include whether another app or Bluetooth was active.
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: Safety confirmation
      options:
        - label: I understand that each firmware needs a separately reviewed offset/signature manifest.
          required: true
        - label: I removed unrelated personal log data and did not attach copyrighted app or music content.
          required: true
