name: Device / audio baseline port request
description: Request validation of another Android, SoC and audio HAL baseline.
title: "[Port] <device> <firmware>"
labels:
  - port-request
body:
  - type: markdown
    attributes:
      value: |
        An unlisted device may match a compatible Qualcomm baseline, but it is
        not a verified target. Remove unrelated personal log lines, and do not
        upload paid app APKs or music files.
  - type: input
    id: device
    attributes:
      label: Device, SoC and Android version
      description: Include model, product device, SDK, ro.soc.model, ro.board.platform, firmware incremental and full build fingerprint.
    validations:
      required: true
  - type: input
    id: root
    attributes:
      label: Root and overlay solution
      description: Magisk or KernelSU version, plus the active metamodule when applicable.
    validations:
      required: true
  - type: input
    id: dac
    attributes:
      label: USB DAC and observed behavior
      description: DAC model, source rates tested, displayed rates, expected result, and actual result.
    validations:
      required: true
  - type: textarea
    id: archive
    attributes:
      label: Diagnostic archive link
      description: |
        Run scripts/collect_device_port.sh with adb + root, review the output,
        remove personal information, and attach the resulting archive. It
        should contain the stock ELF files at their original paths, active
        policy/XML/VINTF/init files, AIDL/HIDL discovery, service process maps,
        AudioPolicy/AudioFlinger/ALSA/USB state, and filtered logs. For HIDL,
        include every existing audio.primary*.so, audio.usb*.so,
        audio.bluetooth*.so, android.hardware.audio@*.so, matching service
        binaries, and the mapped PAL/AGM/ACDB dependencies.
    validations:
      required: true
  - type: textarea
    id: stack
    attributes:
      label: Audio stack classification
      description: |-
        State whether the device uses AIDL, HIDL, or both, including the
        interface version. List the SoC/board platform, detected HAL service,
        core/primary HAL library, USB library, and audio-related libraries
        shown in audioserver/audio HAL process maps.
    validations:
      required: true
  - type: textarea
    id: transitions
    attributes:
      label: Transition test results
      description: |-
        With one USB DAC connected, report the DAC display and app result for
        44.1 -> 48 -> 96 -> 44.1 kHz, PCM16/24/32 or Float if tested, stop,
        and reconnect. Include whether another app or Bluetooth was active.
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: Safety confirmation
      options:
        - label: I understand that a compatible-baseline warning is not a claim that my device was tested, and I will verify the result myself.
          required: true
        - label: I removed unrelated personal log data and did not attach copyrighted app or music content.
          required: true
