name: Build Magisk module

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools ndk;29.0.14206865"

      - name: Build and verify module
        shell: bash
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865" bash scripts/build.sh

      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaomi-usb-dac-rate-follower-v0.7.3-alpha
          path: |
            dist/xiaomi-usb-dac-rate-follower-v0.7.3-alpha.zip
            dist/xiaomi-usb-dac-rate-follower-v0.7.3-alpha.zip.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/xiaomi-usb-dac-rate-follower-v0.7.3-alpha.zip#Magisk and KernelSU module" \
            "dist/xiaomi-usb-dac-rate-follower-v0.7.3-alpha.zip.sha256#SHA-256 checksum" \
            --title "Xiaomi USB DAC Rate Follower v0.7.3 Alpha" \
            --prerelease \
            --notes "Exact-firmware experimental build for Xiaomi 17 Ultra OS4.0.0.15.XPACNXM. Apple Music and NetEase are routed to Xiaomi's native USB-only hifi_playback path. The dynamic HIFI profile now opens coherently at PCM32/48 kHz, so MixerThread, the AIDL FMQ and PAL start from one rate and QTI's stock 40 ms calculation creates a 1920-frame queue. Later native rate events synchronize AudioFlinger and PAL across 44.1/48/96 kHz and above. The installer also restores the unsafe v0.7.2 HAL frame-count modification if encountered. No BIT_PERFECT claim, daemon, Zygisk, polling, Preferred Mixer, Deep Buffer patch, or live audio restart. KernelSU requires a metamodule. Hardware transition testing is still required."
