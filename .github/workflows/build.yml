name: Build Magisk module

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Build and verify module
        shell: bash
        run: bash scripts/build.sh

      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaomi17-bitperfect-v0.3.1-alpha
          path: |
            dist/xiaomi17-bitperfect-v0.3.1-alpha.zip
            dist/xiaomi17-bitperfect-v0.3.1-alpha.zip.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/xiaomi17-bitperfect-v0.3.1-alpha.zip#Magisk and KernelSU module" \
            "dist/xiaomi17-bitperfect-v0.3.1-alpha.zip.sha256#SHA-256 checksum" \
            --title "Xiaomi 17 USB Whitelist Rate Follower v0.3.1 Alpha" \
            --notes "Research archive: enables Xiaomi/AOSP Feature 8, adds a 44.1/48 kHz deep-buffer mixer profile, and gates source-rate following to Apple Music and NetEase Cloud Music while a USB DAC is active. This release proves sample-rate following, not bit-perfect output."
