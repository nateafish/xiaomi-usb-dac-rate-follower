name: Build Magisk module

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools ndk;29.0.14206865"

      - name: Build and verify module
        shell: bash
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865" bash scripts/build.sh

      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaomi-usb-dac-rate-follower-v0.6.5-alpha
          path: |
            dist/xiaomi-usb-dac-rate-follower-v0.6.5-alpha.zip
            dist/xiaomi-usb-dac-rate-follower-v0.6.5-alpha.zip.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/xiaomi-usb-dac-rate-follower-v0.6.5-alpha.zip#Magisk and KernelSU module" \
            "dist/xiaomi-usb-dac-rate-follower-v0.6.5-alpha.zip.sha256#SHA-256 checksum" \
            --title "Xiaomi USB DAC Rate Follower v0.6.5 Alpha" \
            --prerelease \
            --notes "Exact-firmware experimental build for Xiaomi 17 Ultra OS4.0.0.15.XPACNXM. It repairs Xiaomi's dormant USB hifi_playback configuration and selects it for Apple Music/NetEase through Preferred Mixer DEFAULT behavior. A lock-local native arbiter coordinates HIFI and Deep Buffer over the shared USB backend, with no added persistent counters. Deep Buffer retains AIDL XML/HAL 44.1/48 support. No BIT_PERFECT flag, daemon, Zygisk, polling, or live audio restart. KernelSU requires a metamodule. Hardware transition testing is still required."
