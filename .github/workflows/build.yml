name: Build Magisk module

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools ndk;29.0.14206865"

      - name: Build and verify module
        shell: bash
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865" bash scripts/build.sh

      - name: Resolve module artifact
        id: module
        shell: bash
        run: |
          version="$(sed -n 's/^version=//p' module/module.prop)"
          artifact="xiaomi-usb-dac-rate-follower-v${version}"
          test -n "$version"
          test -f "dist/${artifact}.zip"
          test -f "dist/${artifact}.zip.sha256"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"

      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.module.outputs.artifact }}
          path: |
            dist/${{ steps.module.outputs.artifact }}.zip
            dist/${{ steps.module.outputs.artifact }}.zip.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          MODULE_VERSION: ${{ steps.module.outputs.version }}
          MODULE_ARTIFACT: ${{ steps.module.outputs.artifact }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "dist/${MODULE_ARTIFACT}.zip#Magisk and KernelSU module" \
              "dist/${MODULE_ARTIFACT}.zip.sha256#SHA-256 checksum" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "dist/${MODULE_ARTIFACT}.zip#Magisk and KernelSU module" \
              "dist/${MODULE_ARTIFACT}.zip.sha256#SHA-256 checksum" \
              --title "Xiaomi USB DAC Rate Follower v${MODULE_VERSION}" \
              --prerelease \
              --generate-notes
          fi
